<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>卫戍协议·阵容顾问</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="title-row">
        <h1 class="site-title">卫戍协议·阵容顾问</h1>
        <p class="season-tag">规程·序列Ⅰ</p>
      </div>
      <p class="tagline">非官方工具，数值以 PRTS 为准。数据会随赛季变化。社区推荐与官方效果分开标注。</p>
      <div id="chip-list" class="chip-list"></div>
    </header>

    <main>
      <div class="mid">
        <section id="route-panel" class="card" aria-label="推荐路线"></section>
        <section id="roster-panel" class="card" aria-label="已有干员"></section>
      </div>
      <section id="status-card" class="card status-card" aria-label="当前激活状态"></section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <!-- 同步写入的数据包，保证双击 index.html（file://）时不必 fetch JSON -->
  <script src="js/data.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
